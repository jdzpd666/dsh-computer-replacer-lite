- insert:
    - id: computer-replacer
      name: "dsh-computer-replacer"

- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      workspace-write-never:
        sandbox: workspace-write
        approval: never
        name: 工作区内修改（永不询问）
        description: 写入工作区，需要审批的操作不弹卡、直接拒绝
      workspace-write-ask:
        sandbox: workspace-write
        approval: ask
        name: 工作区内修改（询问）
        description: 写入工作区，需要审批的操作弹卡询问
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: 完全权限（全放行）
        description: 完全文件访问，不弹审批卡
    defaultPreset: danger-full-access
